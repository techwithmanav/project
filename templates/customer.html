<!DOCTYPE html>
<html>

<head>
    <title>👤 Customer Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>👤 Customer Details</h1>

    <div class="card">

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="👤 Enter Name"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="📞 Enter 10-digit Phone"
                maxlength="10"
                required
            >

            <input
                type="text"
                name="address"
                placeholder="🏠 Enter Delivery Address"
                required
            >

            <button type="submit">
                Continue 🍽️
            </button>

        </form>

    </div>

</div>

</body>
</html>
